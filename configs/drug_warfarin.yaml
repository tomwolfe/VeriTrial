drug:
  name: warfarin
  mol_weight: 308.33  # g/mol
  log_p: 2.56
  pka: [5.0]  # acidic, mostly unionized at pH 7.4
  fup: 0.008  # fraction unbound plasma
  bp_ratio: 0.8  # blood:plasma ratio
  dose_unit: mg
  # PK parameters (literature: Gabriel et al., Clin Pharmacokinet 1994; Hamberg et al.)
  # Units: typical_cl_f and typical_v_f are TOTAL values for a 70 kg reference adult.
  #   CL/F ~ 0.15 L/h total -> t1/2 ~ 0.693*V/F/CL/F ~ 0.693*8.4/0.15 ~ 39 h (matches ~38 h ref)
  #   Vz/F ~ 0.12 L/kg * 70 kg ~ 8.4 L
  typical_cl_f: 0.15  # L/h (total, 70 kg reference)
  typical_v_f: 8.4    # L (total, 70 kg reference)
  ka: 1.0             # 1/h absorption rate constant
  bioavailability: 0.95  # fraction absorbed
  metabolizing_enzyme: cyp2c9  # S-warfarin clearance is CYP2C9 mediated
  # Dose-response
  target: vkorc1
  ec50: 3.0  # mg/L nominal INR response
  emax: 5.0
  hill_coeff: 2.0
  # Safety
  qtcd_baseline: 400.0  # ms
  qtcd_slope: 0.0  # no significant QT prolongation expected
  dili_risk: 0.01  # low baseline risk
  # DILI exposure-response (explicit per drug)
  alt_baseline: 22.0
  bili_baseline: 0.8
  dili_emax_alt: 0.5
  dili_ec50_alt: 20.0
  dili_emax_bili: 1.1
  dili_ec50_bili: 25.0